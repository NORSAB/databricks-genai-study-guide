<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" role="img" aria-label="Figure 6.1: The RAG Evaluation Triad">
  <title>Figure 6.1: The RAG Evaluation Triad</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600;700&amp;display=swap');
      text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      .mono {
        font-family: 'JetBrains Mono', Consolas, monospace !important;
      }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#050505"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A8A8A8"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#E83808"/>
    </marker>
  </defs>

  <rect width="800" height="480" rx="8" fill="#F8F8F8"/>
  <rect x="1" y="1" width="798" height="478" rx="7" fill="none" stroke="#E2E8F0" stroke-width="1.5"/>

  <text x="32" y="44" font-size="18" font-weight="800" fill="#050505" letter-spacing="-0.01em">THE RAG EVALUATION TRIAD</text>
  <text x="32" y="68" font-size="13" font-weight="500" fill="#6B6B6B">Diagnostic failure isolation: evaluating each triangle edge isolates retriever vs. generator issues</text>

  <!-- Top Node: User Query -->
  <g id="caja-1">
    <rect x="270" y="84" width="260" height="72" rx="6" fill="#FFFFFF" stroke="#050505" stroke-width="1.5"/>
    <text x="400" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#6B6B6B">INPUT</text>
    <text x="400" y="136" text-anchor="middle" font-size="16" font-weight="800" fill="#050505">User Query</text>
  </g>

  <!-- Left Branch: Query -> Context Relevance -> Retrieved Context (Clean Segmented Connectors) -->
  <g id="left-branch">
    <!-- Arrow 1: Query to Context Relevance box -->
    <line x1="310" y1="156" x2="216" y2="174" stroke="#050505" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Metric 1 Box: Context Relevance -->
    <rect x="52" y="174" width="200" height="50" rx="5" fill="#FFFFFF" stroke="#050505" stroke-width="1.5"/>
    <text x="152" y="196" text-anchor="middle" font-size="12.5" font-weight="700" fill="#050505">1. Context Relevance</text>
    <text x="152" y="213" text-anchor="middle" font-size="11" font-weight="500" fill="#6B6B6B">Are retrieved chunks on-topic?</text>
    
    <!-- Arrow 2: Context Relevance box down to Retrieved Context -->
    <line x1="152" y1="224" x2="152" y2="252" stroke="#050505" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- Right Branch: Query -> Answer Relevance -> Generated Answer (Clean Segmented Connectors) -->
  <g id="right-branch">
    <!-- Arrow 1: Query to Answer Relevance box -->
    <line x1="490" y1="156" x2="584" y2="174" stroke="#050505" stroke-width="2" marker-end="url(#arrow)"/>
    
    <!-- Metric 3 Box: Answer Relevance -->
    <rect x="548" y="174" width="200" height="50" rx="5" fill="#FFFFFF" stroke="#050505" stroke-width="1.5"/>
    <text x="648" y="196" text-anchor="middle" font-size="12.5" font-weight="700" fill="#050505">3. Answer Relevance</text>
    <text x="648" y="213" text-anchor="middle" font-size="11" font-weight="500" fill="#6B6B6B">Does answer match user intent?</text>
    
    <!-- Arrow 2: Answer Relevance box down to Generated Answer -->
    <line x1="648" y1="224" x2="648" y2="252" stroke="#050505" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- Bottom Left Node: Retrieved Context -->
  <g id="caja-2">
    <rect x="32" y="254" width="224" height="120" rx="6" fill="#FFFFFF" stroke="#050505" stroke-width="1.5"/>
    <text x="52" y="284" font-size="12.5" font-weight="700" fill="#6B6B6B">RETRIEVAL</text>
    <text x="52" y="308" font-size="16" font-weight="800" fill="#050505">Retrieved Context</text>
    <text x="52" y="334" font-size="13" font-weight="500" fill="#6B6B6B">Top-k Vector Chunks</text>
    <text x="52" y="354" font-size="12" class="mono" font-weight="600" fill="#6B6B6B">Recall / NDCG@k</text>
  </g>

  <!-- Bottom Middle: Groundedness (Qualtop Accent) -->
  <g id="caja-3">
    <!-- Clean arrow from Retrieved Context to Groundedness -->
    <line x1="256" y1="314" x2="284" y2="314" stroke="#E83808" stroke-width="2" marker-end="url(#arrow-accent)"/>
    
    <rect x="286" y="254" width="228" height="120" rx="6" fill="#FFFFFF" stroke="#E83808" stroke-width="2"/>
    <text x="400" y="284" text-anchor="middle" font-size="12.5" font-weight="700" fill="#E83808">2. GROUNDEDNESS</text>
    <text x="400" y="310" text-anchor="middle" font-size="16" font-weight="800" fill="#050505">Faithfulness</text>
    <text x="400" y="334" text-anchor="middle" font-size="12.5" font-weight="500" fill="#6B6B6B">Claims supported by chunks?</text>
    <text x="400" y="354" text-anchor="middle" font-size="12" font-weight="700" fill="#E83808">Low score = Hallucination</text>

    <!-- Clean arrow from Groundedness to Generated Answer -->
    <line x1="514" y1="314" x2="542" y2="314" stroke="#E83808" stroke-width="2" marker-end="url(#arrow-accent)"/>
  </g>

  <!-- Bottom Right Node: Generated Answer -->
  <g id="caja-4">
    <rect x="544" y="254" width="224" height="120" rx="6" fill="#FFFFFF" stroke="#050505" stroke-width="1.5"/>
    <text x="564" y="284" font-size="12.5" font-weight="700" fill="#6B6B6B">GENERATION</text>
    <text x="564" y="308" font-size="16" font-weight="800" fill="#050505">Generated Answer</text>
    <text x="564" y="334" font-size="13" font-weight="500" fill="#6B6B6B">LLM Model Response</text>
    <text x="564" y="354" font-size="12" class="mono" font-weight="600" fill="#6B6B6B">Source Citations</text>
  </g>

  <!-- Summary Strip -->
  <g id="takeaway">
    <rect x="32" y="402" width="736" height="48" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <text x="48" y="431" font-size="12.5" font-weight="500" fill="#6B6B6B">
      <tspan font-weight="700" fill="#050505">Diagnostic Rule: </tspan>Low context relevance signals retrieval failure; low groundedness signals hallucination.
    </text>
  </g>
</svg>