<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" role="img" aria-label="Figure 4.1: Mosaic AI Agent ReAct Cycle">
  <title>Figure 4.1: Mosaic AI Agent ReAct Cycle</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600;700&amp;display=swap');
      text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      .mono {
        font-family: 'JetBrains Mono', Consolas, monospace !important;
      }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#050505"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A8A8A8"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#E83808"/>
    </marker>
  </defs>

  <rect width="800" height="480" rx="8" fill="#F8F8F8"/>
  <rect x="1" y="1" width="798" height="478" rx="7" fill="none" stroke="#E2E8F0" stroke-width="1.5"/>

  <text x="32" y="44" font-size="18" font-weight="800" fill="#050505" letter-spacing="-0.01em">MOSAIC AI AGENT REACT EXECUTION LOOP</text>
  <text x="32" y="68" font-size="13" font-weight="500" fill="#6B6B6B">The cyclic interaction between foundation model reasoning and governed Unity Catalog tools</text>

  <!-- Box 1: Thought -->
  <g id="caja-1">
    <rect x="32" y="120" width="156" height="230" rx="6" fill="#FFFFFF" stroke="#050505" stroke-width="1.5"/>
    <text x="52" y="152" font-size="13" font-weight="700" fill="#6B6B6B" letter-spacing="0.05em">PHASE 01</text>
    <text x="52" y="178" font-size="16" font-weight="800" fill="#050505">Thought</text>
    
    <text x="52" y="218" font-size="13.5" font-weight="700" fill="#050505">LLM Reason</text>
    <text x="52" y="238" font-size="13" font-weight="500" fill="#6B6B6B">Inspects state</text>
    
    <text x="52" y="278" font-size="13.5" font-weight="700" fill="#050505">Docstrings</text>
    <text x="52" y="298" font-size="13" font-weight="500" fill="#6B6B6B">Selects tool</text>
  </g>

  <!-- Arrow 1 -> 2 (Highlighted) -->
  <g id="flecha-1">
    <line x1="188" y1="235" x2="222" y2="235" stroke="#E83808" stroke-width="2" marker-end="url(#arrow-accent)"/>
  </g>

  <!-- Box 2: Action (Clean #E83808 label) -->
  <g id="caja-2">
    <rect x="226" y="120" width="156" height="230" rx="6" fill="#FFFFFF" stroke="#E83808" stroke-width="2"/>
    <text x="246" y="152" font-size="13" font-weight="700" fill="#E83808" letter-spacing="0.05em">PHASE 02</text>
    <text x="246" y="178" font-size="16" font-weight="800" fill="#E83808">Action</text>
    
    <text x="246" y="218" font-size="13.5" font-weight="700" fill="#050505">Tool Invocation</text>
    <text x="246" y="238" font-size="13" font-weight="500" fill="#6B6B6B">UC SQL / Python</text>
    
    <text x="246" y="278" font-size="13.5" font-weight="700" fill="#050505">Permissions</text>
    <text x="246" y="298" font-size="13" font-weight="500" fill="#E83808">Governed sandbox</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g id="flecha-2">
    <line x1="382" y1="235" x2="416" y2="235" stroke="#050505" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- Box 3: Observation -->
  <g id="caja-3">
    <rect x="420" y="120" width="156" height="230" rx="6" fill="#FFFFFF" stroke="#050505" stroke-width="1.5"/>
    <text x="440" y="152" font-size="13" font-weight="700" fill="#6B6B6B" letter-spacing="0.05em">PHASE 03</text>
    <text x="440" y="178" font-size="16" font-weight="800" fill="#050505">Observation</text>
    
    <text x="440" y="218" font-size="13.5" font-weight="700" fill="#050505">Tool Output</text>
    <text x="440" y="238" font-size="13" font-weight="500" fill="#6B6B6B">Returns payload</text>
    
    <text x="440" y="278" font-size="13.5" font-weight="700" fill="#050505">Append State</text>
    <text x="440" y="298" font-size="13" font-weight="500" fill="#6B6B6B">Updates messages</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <g id="flecha-3">
    <line x1="576" y1="235" x2="610" y2="235" stroke="#050505" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- Box 4: Decision -->
  <g id="caja-4">
    <rect x="614" y="120" width="154" height="230" rx="6" fill="#FFFFFF" stroke="#050505" stroke-width="1.5"/>
    <text x="634" y="152" font-size="13" font-weight="700" fill="#6B6B6B" letter-spacing="0.05em">PHASE 04</text>
    <text x="634" y="178" font-size="16" font-weight="800" fill="#050505">Decision</text>
    
    <text x="634" y="218" font-size="13.5" font-weight="700" fill="#050505">Completion?</text>
    <text x="634" y="238" font-size="13" font-weight="500" fill="#6B6B6B">Evaluates goal</text>
    
    <text x="634" y="278" font-size="13.5" font-weight="700" fill="#050505">Final Answer</text>
    <text x="634" y="298" font-size="13" font-weight="500" fill="#6B6B6B">Or loop again</text>
  </g>

  <!-- Return Loop Arc -->
  <g id="loop-arc">
    <path d="M 691 350 L 691 390 L 110 390 L 110 356" fill="none" stroke="#A8A8A8" stroke-width="2" marker-end="url(#arrow-gray)"/>
    <text x="400" y="382" text-anchor="middle" font-size="12" font-weight="600" fill="#6B6B6B">Next iteration step if goal incomplete</text>
  </g>

  <g id="takeaway">
    <rect x="32" y="416" width="736" height="44" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <text x="48" y="443" font-size="12.5" font-weight="500" fill="#6B6B6B">
      <tspan font-weight="700" fill="#050505">Guardrail: </tspan>Set strict recursion limits to prevent unbounded token spend during tool retry loops.
    </text>
  </g>
</svg>