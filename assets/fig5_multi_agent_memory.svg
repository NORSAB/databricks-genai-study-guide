<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" role="img" aria-label="Figure 5.1: Multi-Agent Supervisor Routing and State Store">
  <title>Figure 5.1: Multi-Agent Supervisor Routing and State Store</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600;700&amp;display=swap');
      text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }
      .mono {
        font-family: 'JetBrains Mono', Consolas, monospace !important;
      }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#050505"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#A8A8A8"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#E83808"/>
    </marker>
  </defs>

  <rect width="800" height="480" rx="8" fill="#F8F8F8"/>
  <rect x="1" y="1" width="798" height="478" rx="7" fill="none" stroke="#E2E8F0" stroke-width="1.5"/>

  <text x="32" y="44" font-size="18" font-weight="800" fill="#050505" letter-spacing="-0.01em">MULTI-AGENT SUPERVISOR ROUTING &amp; STATE</text>
  <text x="32" y="68" font-size="13" font-weight="500" fill="#6B6B6B">Hierarchical state coordination decomposing requests into specialized, testable worker agents</text>

  <!-- Top Supervisor Node (Clean #E83808 label) -->
  <g id="caja-1">
    <rect x="200" y="94" width="400" height="112" rx="6" fill="#FFFFFF" stroke="#E83808" stroke-width="2"/>
    <text x="400" y="122" text-anchor="middle" font-size="12.5" font-weight="700" fill="#E83808" letter-spacing="0.05em">CENTRAL COORDINATOR</text>
    <text x="400" y="146" text-anchor="middle" font-size="17" font-weight="800" fill="#050505">Supervisor Router</text>
    <text x="400" y="170" text-anchor="middle" font-size="13" font-weight="500" fill="#6B6B6B">Classifies user intent &amp; delegates tasks to specialists</text>
    <text x="400" y="190" text-anchor="middle" font-size="12.5" font-weight="500" fill="#6B6B6B">Enforces recursion limits across conversational turns</text>
  </g>

  <!-- Connectors from Supervisor down to Workers -->
  <g id="flechas-down">
    <line x1="300" y1="206" x2="148" y2="238" stroke="#050505" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="400" y1="206" x2="400" y2="238" stroke="#050505" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="500" y1="206" x2="652" y2="238" stroke="#050505" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- Worker 1 -->
  <g id="caja-2">
    <rect x="32" y="244" width="224" height="142" rx="6" fill="#FFFFFF" stroke="#050505" stroke-width="1.5"/>
    <text x="52" y="274" font-size="13" font-weight="700" fill="#6B6B6B">WORKER 01</text>
    <text x="52" y="298" font-size="16" font-weight="800" fill="#050505">Genie / SQL</text>
    <text x="52" y="324" font-size="13" font-weight="500" fill="#6B6B6B">Structured Delta KPIs</text>
    <text x="52" y="344" font-size="13" font-weight="500" fill="#6B6B6B">Pre-aggregated metrics</text>
  </g>

  <!-- Worker 2 -->
  <g id="caja-3">
    <rect x="288" y="244" width="224" height="142" rx="6" fill="#FFFFFF" stroke="#050505" stroke-width="1.5"/>
    <text x="308" y="274" font-size="13" font-weight="700" fill="#6B6B6B">WORKER 02</text>
    <text x="308" y="298" font-size="16" font-weight="800" fill="#050505">RAG Specialist</text>
    <text x="308" y="324" font-size="13" font-weight="500" fill="#6B6B6B">Unstructured policy texts</text>
    <text x="308" y="344" font-size="13" font-weight="500" fill="#6B6B6B">Vector search retriever</text>
  </g>

  <!-- Worker 3 -->
  <g id="caja-4">
    <rect x="544" y="244" width="224" height="142" rx="6" fill="#FFFFFF" stroke="#050505" stroke-width="1.5"/>
    <text x="564" y="274" font-size="13" font-weight="700" fill="#6B6B6B">WORKER 03</text>
    <text x="564" y="298" font-size="16" font-weight="800" fill="#050505">Action Worker</text>
    <text x="564" y="324" font-size="13" font-weight="500" fill="#6B6B6B">Governed UC tool calls</text>
    <text x="564" y="344" font-size="13" font-weight="500" fill="#6B6B6B">Human-in-the-loop gate</text>
  </g>

  <!-- Bottom State Store -->
  <g id="caja-5">
    <rect x="32" y="404" width="736" height="48" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <text x="48" y="433" font-size="12.5" font-weight="500" fill="#6B6B6B">
      <tspan font-weight="700" fill="#050505">Session State: </tspan>Checkpoints persist in Delta Lake tables, surviving worker container restarts.
    </text>
  </g>
</svg>